services:
  postgres:
    image: postgres:16-alpine
    container_name: miu-postgres
    environment:
      POSTGRES_USER: miu
      POSTGRES_PASSWORD: miu123
      POSTGRES_DB: made_in_uzbekistan
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: miu-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
